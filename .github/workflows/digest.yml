# 毎日 1 回、百目を実行して俯瞰ダイジェストを GitHub Pages に公開する。
#
# 必要な設定（リポジトリの Settings から）:
#   1. Pages → Build and deployment → Source を "GitHub Actions" にする
#   2. Secrets and variables → Actions → New repository secret で
#      ANTHROPIC_API_KEY を登録する（未登録の間はダミーデータで動く）
#
# 公開先: https://<ユーザー名>.github.io/hyakume/

name: digest

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST
  workflow_dispatch:        # Actions タブから手動実行もできる
    inputs:
      personas:
        description: "ペルソナ数（初回のみ生成）"
        default: "50"
      limit:
        description: "収集する人数（0 = 全員）"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HYAKUME_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # 前回までのペルソナを引き継ぐ（無ければ新規生成される）
      - name: Restore personas
        uses: actions/cache/restore@v4
        with:
          path: data/personas.json
          key: personas-${{ github.run_id }}
          restore-keys: personas-

      - name: Run hyakume
        run: |
          set -e
          MOCK=""
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY が未設定のため、ダミーデータで実行します"
            MOCK="--mock"
          fi
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          COUNT="${{ github.event.inputs.personas || '50' }}"
          hyakume $MOCK run -n "$COUNT" --limit "$LIMIT" --workers 4

      - name: Save personas
        uses: actions/cache/save@v4
        with:
          path: data/personas.json
          key: personas-${{ github.run_id }}

      - name: Prepare site
        run: |
          set -e
          RUN=$(ls data/runs | sort | tail -n 1)
          mkdir -p site/runs/"$RUN"
          cp data/runs/"$RUN"/digest.html site/index.html
          cp data/runs/"$RUN"/digest.md   site/digest.md
          cp data/runs/"$RUN"/digest.html site/runs/"$RUN"/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
